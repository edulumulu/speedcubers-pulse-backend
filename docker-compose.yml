services:
  postgres:
    image: postgres:14-alpine
    container_name: speedcubers_postgres
    environment:
      POSTGRES_USER: speedcubers
      POSTGRES_PASSWORD: speedcubers
      POSTGRES_DB: speedcubers_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedcubers"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:14-alpine
    container_name: speedcubers_postgres_test
    environment:
      POSTGRES_USER: speedcubers
      POSTGRES_PASSWORD: speedcubers
      POSTGRES_DB: speedcubers_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedcubers"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: speedcubers_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
